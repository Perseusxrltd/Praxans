name: Living world
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=768
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: node --import tsx --test --test-concurrency=2 tests/web/*.test.ts
      - run: npm run test:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:extinction
      - run: npm run test:renewal
      - run: npm run test:exploration
      - run: npm run test:connection
      - run: npm run test:startup
      - run: npm run test:hotfix
      - run: npm run test:reconnect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-observations
          path: |
            output/playwright/browser-smoke
            output/playwright/extinction-smoke
            output/playwright/renewal-smoke
            output/playwright/exploration-smoke
            output/playwright/connection-smoke
            output/playwright/startup-smoke
            output/playwright/hotfix-smoke
            output/playwright/reconnect-smoke
          retention-days: 7
