name: Living world
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:extinction
      - run: npm run test:hotfix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-observations
          path: |
            output/playwright/browser-smoke
            output/playwright/extinction-smoke
            output/playwright/hotfix-smoke
          retention-days: 7
